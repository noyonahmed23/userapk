name: Signed Release APK
# Rebuild signed release artifacts after wallet safety guards and admin access checks.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-key.jks
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Firebase Android app
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          elif [ -s app/google-services.json ]; then
            echo "Using app/google-services.json already present in this repository."
          else
            echo "::error::Firebase config missing. Add user app's google-services.json at app/google-services.json or set GOOGLE_SERVICES_JSON_BASE64 in repository Actions secrets."
            exit 1
          fi
          test -s app/google-services.json || { echo "::error::Firebase config file is empty."; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Verify signing secrets
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing repository secret: KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing repository secret: STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing repository secret: KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing repository secret: KEY_ALIAS"; exit 1; }

      - name: Decode signing keystore
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build signed Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KHELOBD-User-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keystore from runner
        if: always()
        shell: bash
        run: rm -f "$KEYSTORE_PATH" app/google-services.json
